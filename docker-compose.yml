services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dinoroar-app:latest
    container_name: dinoroar-app
    restart: unless-stopped
    ports:
      # 宿主机 HTTP 单端口映射（Web 页面与 API 共用）
      - "${APP_HTTP_PORT:-8080}:8080"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - SERVICE_ADVERTISE_HOST=${SERVICE_ADVERTISE_HOST:-}
      - DATABASE_URL=sqlite:////workspace/data/dinoroar.db
      - STT_API_URL=http://stt:18000/api/transcribe
      - UPLOAD_DIR=/workspace/uploads
      - DATA_DIR=/workspace/data
    volumes:
      # 数据库与上传文件持久化挂载
      - ${HOST_DATA_DIR:-/opt/docker/dinoroar/data}:/workspace/data
      - ${HOST_UPLOADS_DIR:-/opt/docker/dinoroar/uploads}:/workspace/uploads
      # 挂载宿主机时区文件，保证日志与日记时间一致
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: "json-file"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"
    networks:
      - dinoroar_net
      - dinoroar_mdns

  stt:
    build:
      context: ./stt
      dockerfile: Dockerfile
    image: dinoroar-stt:latest
    container_name: dinoroar-stt
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      # 语音识别 ONNX 模型缓存挂载
      - ${HOST_STT_MODELS_DIR:-/opt/docker/dinoroar/stt_models}:/app/models
      # 挂载宿主机时区文件
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: "json-file"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"
    networks:
      - dinoroar_net

networks:
  dinoroar_net:
    name: dinoroar_net
    driver: bridge
  dinoroar_mdns:
    name: dinoroar_mdns
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-dinoroar


