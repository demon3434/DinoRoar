{% extends "admin_base.html" %}

{% block title %}系统清理与物理维护 - 控制台 - DinoRoar{% endblock %}

{% block content %}
    <header style="margin-bottom: 30px;">
        <h2 style="font-size: 1.4rem; font-weight: 800;">🧹 系统清理与物理维护</h2>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">深度维护底层物理存储，防止未关联的废弃附件占用多余空间</p>
    </header>

    <div class="card" style="max-width: 650px; border: 1px solid var(--card-border);">
        <div class="card-title">磁盘维护与冗余清理</div>
        <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 25px; line-height: 1.6;">
            “孤儿文件清理”模块将会主动扫描并彻底删除本地硬盘 <code>uploads/attachments/</code> 中没有被任何日志关联的图片和音视频物理文件，以节省家庭服务器存储空间。
        </p>
        <button id="cleanupBtn" class="btn btn-primary-purple" onclick="runSystemCleanup()" style="display: inline-flex; align-items: center; gap: 8px;">
            🧹 执行系统清理
        </button>
        <div id="cleanupResult" style="margin-top: 25px; font-size: 0.9rem; display: none; padding: 15px; border-radius: 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--card-border); line-height: 1.6;"></div>
    </div>
{% endblock %}

{% block scripts %}
<script>
    async function runSystemCleanup() {
        const btn = document.getElementById('cleanupBtn');
        const resultBox = document.getElementById('cleanupResult');
        // Prevent duplicate clicks
        if (btn.disabled) {
            return;
        }
        btn.disabled = true;
        btn.innerText = '🧹 正在清理...';
        resultBox.style.display = 'block';
        resultBox.style.color = 'var(--text-muted)';
        resultBox.textContent = '🔄 磁盘深度扫描中，请稍候...';

        const endpoints = ['/api/admin/cleanup_stickers', '/api/admin/cleanup_canvases', '/api/admin/cleanup'];
        let totalDeleted = 0;
        let totalFreed = 0;
        try {
            for (const ep of endpoints) {
                const res = await fetch(ep, { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
                if (!res.ok) {
                    throw new Error(`接口 ${ep} 返回错误状态`);
                }
                const data = await res.json();
                totalDeleted += (data.deleted_files ? data.deleted_files.length : 0);
                totalFreed += (data.freed_bytes || 0);
            }
            const sizeMB = (totalFreed / 1024 / 1024).toFixed(2);
            resultBox.style.color = 'var(--dino-green)';
            resultBox.innerHTML = `
                <strong style="font-size: 0.95rem;">✅ 清理完成！</strong><br>
                - 共删除无用文件: <code style="color:var(--text-main); font-weight:bold;">${totalDeleted}</code> 个<br>
                - 释放物理硬盘空间: <code style="color:var(--text-main); font-weight:bold;">${sizeMB} MB</code>
            `;
        } catch (e) {
            console.error(e);
            resultBox.style.color = 'var(--dino-red)';
            resultBox.textContent = '❌ 清理失败，详情请检查后台日志。';
        } finally {
            btn.disabled = false;
            btn.innerText = '🧹 执行系统清理';
        }
    }
</script>
{% endblock %}
