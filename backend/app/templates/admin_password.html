{% extends "admin_base.html" %}

{% block title %}修改安全密码 - 控制台 - DinoRoar{% endblock %}

{% block content %}
<header style="margin-bottom: 30px;">
    <h2 style="font-size: 1.4rem; font-weight: 800;">🔒 修改管理员密码</h2>
    <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">定期更新您的管理员安全密码以保护服务器数据安全</p>
</header>

<div class="card" style="max-width: 550px; border: 1px solid var(--card-border);">
    <div class="card-title">安全验证与修改</div>
    
    <div class="form-group">
        <label class="form-label" for="adminCurrentPassword">当前登录密码</label>
        <input class="form-control" type="password" id="adminCurrentPassword" placeholder="输入当前登录密码">
    </div>
    
    <div class="form-group">
        <label class="form-label" for="adminNewPassword">设置新密码</label>
        <input class="form-control" type="password" id="adminNewPassword" placeholder="输入新密码 (6位以上)">
    </div>
    
    <div class="form-group">
        <label class="form-label" for="adminConfirmPassword">确认新密码</label>
        <input class="form-control" type="password" id="adminConfirmPassword" placeholder="再次输入新密码以进行确认">
    </div>
    
    <button class="btn btn-primary-purple" onclick="handleChangeAdminPassword()" style="margin-top: 15px; width: 100%; justify-content: center;">
        确定修改密码
    </button>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function handleChangeAdminPassword() {
        const currentPassword = document.getElementById('adminCurrentPassword').value;
        const newPassword = document.getElementById('adminNewPassword').value;
        const confirmPassword = document.getElementById('adminConfirmPassword').value;

        if (!currentPassword || !newPassword || !confirmPassword) {
            showToast("请填写所有字段", "error");
            return;
        }

        if (newPassword !== confirmPassword) {
            showToast("两次输入的新密码不一致", "error");
            return;
        }

        try {
            const res = await fetch('/api/admin/change-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({
                    current_password: currentPassword,
                    new_password: newPassword
                })
            });

            if (res.ok) {
                showToast("密码修改成功，即将重新登录...", "success");
                document.getElementById('adminCurrentPassword').value = '';
                document.getElementById('adminNewPassword').value = '';
                document.getElementById('adminConfirmPassword').value = '';
                setTimeout(handleLogout, 1500);
            } else {
                const err = await res.json();
                showToast("修改失败: " + err.detail, "error");
            }
        } catch(e) {
            showToast("网络连接失败，请稍后重试", "error");
        }
    }
</script>
{% endblock %}
