<!DOCTYPE html>
<html lang="zh-CN" class="theme-dark-neon">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}小恐龙 DinoRoar - 秘密基地{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/images/ic_launcher.png">
    
    <!-- Local Fonts -->
    <link rel="stylesheet" href="/static/css/fonts.css">
    
    <!-- Local ChartJS -->
    <script src="/static/js/chart.umd.min.js"></script>
    
    <!-- Split Static Stylesheet -->
    <link rel="stylesheet" href="/static/css/dashboard.css?v=202607142306">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Token verification & Theme recovery BEFORE rendering elements to prevent flash -->
    <script>
        // 如果 URL 中带有 token，自动保存到 localStorage 供免密鉴权使用
        const urlParams = new URLSearchParams(window.location.search);
        const urlToken = urlParams.get('token');
        if (urlToken) {
            localStorage.setItem('token', urlToken);
        }

        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
        }

        // ── 第一阶段：同步立即应用缓存主题（0ms，彻底消除主题闪烁）──
        const cachedTheme = localStorage.getItem('cachedTheme');
        if (cachedTheme) {
            document.documentElement.className = 'theme-' + cachedTheme;
        }

        // ── 第二阶段：异步鉴权 + 填充用户信息 + 更新主题缓存 ──
        async function applyInitialThemeAndUser() {
            try {
                const res = await fetch('/api/auth/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('cachedTheme');
                    window.location.href = '/login';
                    return;
                }
                const user = await res.json();
                if (user.is_admin) {
                    window.location.href = '/admin';
                    return;
                }
                const nick = user.nickname || user.username;
                const childNameEl = document.getElementById('childName');
                if (childNameEl) childNameEl.textContent = nick;
                const sidebarChildNameEl = document.getElementById('sidebarChildName');
                if (sidebarChildNameEl) sidebarChildNameEl.textContent = nick;

                const navEnergyEl = document.getElementById('navEggEnergy');
                if (navEnergyEl) navEnergyEl.textContent = user.egg_energy || 0;

                // 服务端主题与本地缓存不一致时，以服务端为准并更新缓存
                if (user.theme && user.theme !== cachedTheme) {
                    document.documentElement.className = 'theme-' + user.theme;
                    localStorage.setItem('cachedTheme', user.theme);
                }
            } catch(e) {
                console.error("Auth init error", e);
                localStorage.removeItem('token');
                localStorage.removeItem('cachedTheme');
                window.location.href = '/login';
            }
        }
        applyInitialThemeAndUser();
    </script>
 
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="appSidebar">
            <div class="sidebar-brand" onclick="window.location.href='/dashboard'" style="padding: 16px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255, 255, 255, 0.05); overflow: hidden; white-space: nowrap; cursor: pointer;">
                <div style="display: flex; align-items: center; gap: 10px; overflow: hidden;">
                    <div class="dino-avatar" id="sidebarDinoAvatar" style="width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; background: rgba(96, 165, 250, 0.15);">
                        <img src="/static/images/ic_launcher.png" style="width: 100%; height: 100%; object-fit: cover;" />
                    </div>
                    <div class="sidebar-title-container" style="display: flex; flex-direction: column; overflow: hidden; transition: opacity 0.2s ease;">
                        <span class="sidebar-title" id="sidebarChildName" style="font-size: 0.92rem; font-weight: 800; color: var(--text-main); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">小朋友</span>
                        <span style="font-size: 0.72rem; color: var(--text-muted); font-weight: 600;">的秘密基地</span>
                    </div>
                </div>
                <!-- 蛋能量移入蓝框位置 -->
                <div style="display: flex; align-items: center; gap: 3px; padding: 4px 8px; background: rgba(96, 165, 250, 0.12); border: 1px solid rgba(96, 165, 250, 0.25); border-radius: 10px; font-size: 0.82rem; font-weight: 800; color: #3b82f6; flex-shrink: 0;" title="我的蛋能量">
                    <span>🥚</span>
                    <span id="navEggEnergy" style="font-family: monospace; font-size: 0.88rem;">0</span>
                </div>
            </div>

            
            <div class="sidebar-menu">
                <a href="/dashboard" class="menu-item {% if active_tab == 'dashboard' %}active{% endif %}" id="menu-dashboard-tab" style="text-decoration: none; color: inherit;">
                    <span>📊</span>
                    <span class="sidebar-text">首页看板</span>
                </a>
                
                <a href="/diary" class="menu-item {% if active_tab == 'diary' %}active{% endif %}" id="menu-search-tab" style="text-decoration: none; color: inherit;">
                    <span>🔍</span>
                    <span class="sidebar-text">查看日记</span>
                </a>
 
                <a href="/mall" class="menu-item {% if active_tab == 'mall' %}active{% endif %}" id="menu-mall-tab" style="text-decoration: none; color: inherit;">
                    <span>🛍️</span>
                    <span class="sidebar-text">手账商城</span>
                </a>
                
                <div class="menu-item {% if active_tab.startswith('settings') %}active{% endif %}" onclick="toggleSubmenu('settings-submenu')" id="menu-settings-tab">
                    <span>⚙️</span>
                    <span class="sidebar-text">用户设置</span>
                </div>
                
                <div class="submenu" id="settings-submenu" style="max-height: {% if active_tab.startswith('settings') %}200px{% else %}0px{% endif %}; opacity: {% if active_tab.startswith('settings') %}1{% else %}0{% endif %}; transition: max-height 0.3s ease, opacity 0.3s ease;">
                    <a href="/settings/persons" class="submenu-item {% if active_tab == 'settings-persons' %}active{% endif %}" id="menu-settings-persons-tab" style="text-decoration: none; display: block; color: inherit;">
                        👥 关系人管理
                    </a>
                    <a href="/settings/personal" class="submenu-item {% if active_tab == 'settings-personal' %}active{% endif %}" id="menu-settings-personal-tab" style="text-decoration: none; display: block; color: inherit;">
                        🔧 个人参数设置
                    </a>
                </div>
            </div>
 
            <!-- Sidebar Footer with Logout Button -->
            <div class="sidebar-footer" style="padding: 15px; border-top: 1px solid rgba(255,255,255,0.05); overflow: hidden;">
                <button class="logout-btn" onclick="handleLogout()" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; height: 38px; border-radius: 10px; padding: 0 10px; font-size: 0.85rem; background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); color: #fca5a5; transition: all 0.2s ease;" onmouseover="this.style.background='var(--dino-red)'; this.style.borderColor='var(--dino-red)'; this.style.color='white';" onmouseout="this.style.background='rgba(239, 68, 68, 0.1)'; this.style.borderColor='rgba(239, 68, 68, 0.2)'; this.style.color='#fca5a5';">
                    <span>🚪</span>
                    <span class="sidebar-text" style="font-weight: 600; white-space: nowrap;">登出秘密基地</span>
                </button>
            </div>
            
            <div class="sidebar-collapse-btn" onclick="toggleSidebar()">
                <span id="collapseIcon">◀</span>
            </div>
        </aside>
 
        <!-- Main Workspace -->
        <div class="main-wrapper">
            <main class="main-content" style="padding-top: 25px;">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
 
    <!-- Custom Confirm Modal -->
    <div id="confirmModal" class="modal" style="display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); align-items: center; justify-content: center;">
        <div class="card" style="width: 440px; max-width: 92%; padding: 24px 26px; border: 1px solid var(--card-border); border-radius: 22px; box-shadow: 0 20px 40px rgba(0,0,0,0.25); background: var(--card-bg, #fff);">
            <h3 id="confirmModalTitle" style="margin: 0 0 14px 0; font-size: 1.15rem; color: var(--text-main); font-weight: 800; display: flex; align-items: center; gap: 8px;">🎉 确认兑换</h3>
            <div id="confirmModalMessage" style="font-size: 0.9rem; color: var(--text-main); line-height: 1.65; margin-bottom: 22px; white-space: pre-line; background: rgba(139, 92, 246, 0.05); border: 1px solid rgba(139, 92, 246, 0.16); border-radius: 14px; padding: 14px 16px;">这里是确认信息...</div>
            <div style="display: flex; justify-content: flex-end; gap: 12px;">
                <button id="confirmModalCancelBtn" type="button" style="height: 40px; padding: 0 20px; font-size: 0.88rem; border-radius: 12px; border: 1px solid var(--card-border); background: rgba(0,0,0,0.05); color: var(--text-muted); font-weight: 700; cursor: pointer; transition: all 0.2s;">取消</button>
                <button id="confirmModalConfirmBtn" type="button" style="height: 40px; padding: 0 24px; font-size: 0.92rem; border-radius: 12px; font-weight: 800; border: none; background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: #ffffff; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4); cursor: pointer; transition: all 0.2s;">✨ 立即兑换</button>
            </div>
        </div>
    </div>

 
    <!-- Common script functions -->
    <script>
        // Sidebar Toggle
        let isSidebarCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
        if (isSidebarCollapsed) {
            const sidebar = document.getElementById('appSidebar');
            if (sidebar) sidebar.classList.add('collapsed');
            const icon = document.getElementById('collapseIcon');
            if (icon) icon.textContent = '▶';
        }
        function toggleSidebar() {
            const sidebar = document.getElementById('appSidebar');
            const icon = document.getElementById('collapseIcon');
            sidebar.classList.toggle('collapsed');
            const collapsed = sidebar.classList.contains('collapsed');
            localStorage.setItem('sidebarCollapsed', collapsed);
            icon.textContent = collapsed ? '▶' : '◀';
        }
 
        // Submenu Toggle
        function toggleSubmenu(submenuId) {
            const submenu = document.getElementById(submenuId);
            const parentMenu = document.getElementById('menu-settings-tab');
            if (submenu.style.maxHeight === '0px' || submenu.style.maxHeight === '') {
                submenu.style.maxHeight = '200px';
                submenu.style.opacity = '1';
                parentMenu.classList.add('active');
            } else {
                submenu.style.maxHeight = '0px';
                submenu.style.opacity = '0';
                parentMenu.classList.remove('active');
            }
        }
 
        // Logout function
        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('cachedTheme');
            window.location.href = '/login';
        }
 
        // Custom Confirm
        async function showCustomConfirm(title, message, confirmText = "确认") {
            const modal = document.getElementById('confirmModal');
            document.getElementById('confirmModalTitle').textContent = title;
            document.getElementById('confirmModalMessage').textContent = message;
            
            const confirmBtn = document.getElementById('confirmModalConfirmBtn');
            confirmBtn.textContent = confirmText;
            
            modal.style.display = 'flex';
            
            return new Promise((resolve) => {
                const cleanup = (result) => {
                    modal.style.display = 'none';
                    document.getElementById('confirmModalCancelBtn').onclick = null;
                    confirmBtn.onclick = null;
                    resolve(result);
                };
                document.getElementById('confirmModalCancelBtn').onclick = () => cleanup(false);
                confirmBtn.onclick = () => cleanup(true);
            });
        }
        // Global Toast Notification
        window.showToast = function(message, type = 'success') {
            let container = document.getElementById('globalToastContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'globalToastContainer';
                container.style = 'position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none;';
                document.body.appendChild(container);
            }

            const toast = document.createElement('div');
            let bg = 'linear-gradient(135deg, rgba(16, 185, 129, 0.95), rgba(5, 150, 105, 0.95))';
            let icon = '🎉';
            if (type === 'error') {
                bg = 'linear-gradient(135deg, rgba(239, 68, 68, 0.95), rgba(220, 38, 38, 0.95))';
                icon = '❌';
            } else if (type === 'info') {
                bg = 'linear-gradient(135deg, rgba(59, 130, 246, 0.95), rgba(37, 99, 235, 0.95))';
                icon = 'ℹ️';
            }

            toast.style = `
                background: ${bg};
                color: #ffffff;
                padding: 10px 20px;
                border-radius: 30px;
                font-size: 0.9rem;
                font-weight: 800;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
                display: flex;
                align-items: center;
                gap: 8px;
                pointer-events: auto;
                opacity: 0;
                transform: translateY(-12px) scale(0.96);
                transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
            `;
            toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
            container.appendChild(toast);

            // 触发动画显示
            requestAnimationFrame(() => {
                toast.style.opacity = '1';
                toast.style.transform = 'translateY(0) scale(1)';
            });

            // 2.5 秒后自动平滑淡出并销毁
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px) scale(0.95)';
                setTimeout(() => toast.remove(), 250);
            }, 2500);
        };
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
