<!DOCTYPE html>
<html lang="zh-CN" class="theme-dark-neon">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}控制台 - 恐龙风暴 DinoRoar{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/images/ic_launcher.png">
    
    <!-- Local Fonts -->
    <link rel="stylesheet" href="/static/css/fonts.css">
    
    <!-- Dashboard CSS -->
    <link rel="stylesheet" href="/static/css/dashboard.css?v=202607142306">
    {% block head %}<link rel="stylesheet" href="/static/css/admin_base.css">{% endblock %}
    <link rel="stylesheet" href="/static/css/admin_base.css">
</head>
<body>
    <!-- Token verification & Theme recovery BEFORE rendering elements to prevent flash -->
    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
        }
        // Sync theme and auth state immediately
        async function applyInitialThemeAndUser() {
            try {
                const res = await fetch('/api/auth/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) {
                    localStorage.removeItem('token');
                    window.location.href = '/login';
                    return;
                }
                const user = await res.json();
                if (!user.is_admin) {
                    window.location.href = '/dashboard';
                    return;
                }
                
                const nick = user.nickname || user.username || '管理员';
                const sidebarAdminNameEl = document.getElementById('sidebarAdminName');
                if (sidebarAdminNameEl) sidebarAdminNameEl.textContent = nick;
 
                if (user.theme) {
                    document.documentElement.className = 'theme-' + user.theme;
                }
            } catch(e) {
                console.error("Auth init error", e);
                localStorage.removeItem('token');
                window.location.href = '/login';
            }
        }
        applyInitialThemeAndUser();
    </script>
 
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="appSidebar">
            <div class="sidebar-brand" onclick="window.location.href='/admin/users'" style="padding: 20px 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); overflow: hidden; white-space: nowrap; cursor: pointer;">
                <div class="dino-avatar" id="sidebarDinoAvatar" style="width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; background: rgba(139, 92, 246, 0.15);">
                    <img src="/static/images/ic_launcher.png" style="width: 100%; height: 100%; object-fit: cover;" />
                </div>
                <div class="sidebar-title-container" style="display: flex; flex-direction: column; overflow: hidden; transition: opacity 0.2s ease;">
                    <span class="sidebar-title" id="sidebarAdminName" style="font-size: 0.95rem; font-weight: 800; color: var(--text-main); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">管理员</span>
                    <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">控制面板</span>
                </div>
            </div>
            
            <div class="sidebar-menu">
                <!-- 👥 账户管理 -->
                <div class="menu-item {% if active_tab.startswith('admin-users') %}active{% endif %}" onclick="toggleSubmenu('users-submenu')" id="menu-users-tab">
                    <span>👥</span>
                    <span class="sidebar-text">账户管理</span>
                </div>
                <div class="submenu" id="users-submenu" style="max-height: {% if active_tab.startswith('admin-users') %}200px{% else %}0px{% endif %}; opacity: {% if active_tab.startswith('admin-users') %}1{% else %}0{% endif %}; transition: max-height 0.3s ease, opacity 0.3s ease;">
                    <a href="/admin/users" class="submenu-item {% if active_tab == 'admin-users-list' %}active{% endif %}" style="text-decoration: none; display: block; color: inherit;">
                        👦 孩子账号列表
                    </a>
                </div>
 
                <!-- 🎨 手账资产管理 -->
                <div class="menu-item {% if active_tab.startswith('admin-stickers') or active_tab.startswith('admin-canvases') %}active{% endif %}" onclick="toggleSubmenu('stickers-submenu')" id="menu-stickers-tab">
                    <span>🎨</span>
                    <span class="sidebar-text">手账资产管理</span>
                </div>
                <div class="submenu" id="stickers-submenu" style="max-height: {% if active_tab.startswith('admin-stickers') or active_tab.startswith('admin-canvases') %}200px{% else %}0px{% endif %}; opacity: {% if active_tab.startswith('admin-stickers') or active_tab.startswith('admin-canvases') %}1{% else %}0{% endif %}; transition: max-height 0.3s ease, opacity 0.3s ease;">
                    <a href="/admin/stickers" class="submenu-item {% if active_tab == 'admin-stickers-list' %}active{% endif %}" style="text-decoration: none; display: block; color: inherit;">
                        🦄 贴纸管理
                    </a>
                    <a href="/admin/canvases" class="submenu-item {% if active_tab == 'admin-canvases-list' %}active{% endif %}" style="text-decoration: none; display: block; color: inherit;">
                        🖼️ 背景画布管理
                    </a>
                </div>
 
                <!-- ⚙️ 系统维护 -->
                <div class="menu-item {% if active_tab.startswith('admin-system') %}active{% endif %}" onclick="toggleSubmenu('system-submenu')" id="menu-system-tab">
                    <span>⚙️</span>
                    <span class="sidebar-text">系统维护</span>
                </div>
                <div class="submenu" id="system-submenu" style="max-height: {% if active_tab.startswith('admin-system') %}200px{% else %}0px{% endif %}; opacity: {% if active_tab.startswith('admin-system') %}1{% else %}0{% endif %}; transition: max-height 0.3s ease, opacity 0.3s ease;">
                    <a href="/admin/settings" class="submenu-item {% if active_tab == 'admin-system-settings' %}active{% endif %}" style="text-decoration: none; display: block; color: inherit;">
                        🌐 全局服务发现
                    </a>
                    <a href="/admin/maintenance" class="submenu-item {% if active_tab == 'admin-system-maintenance' %}active{% endif %}" style="text-decoration: none; display: block; color: inherit;">
                        🧹 磁盘冗余清理
                    </a>
                </div>
 
                <!-- 🔧 个人设置 -->
                <div class="menu-item {% if active_tab.startswith('admin-personal') %}active{% endif %}" onclick="toggleSubmenu('personal-submenu')" id="menu-personal-tab">
                    <span>🔧</span>
                    <span class="sidebar-text">个人设置</span>
                </div>
                <div class="submenu" id="personal-submenu" style="max-height: {% if active_tab.startswith('admin-personal') %}200px{% else %}0px{% endif %}; opacity: {% if active_tab.startswith('admin-personal') %}1{% else %}0{% endif %}; transition: max-height 0.3s ease, opacity 0.3s ease;">
                    <a href="/admin/password" class="submenu-item {% if active_tab == 'admin-personal-password' %}active{% endif %}" style="text-decoration: none; display: block; color: inherit;">
                        🔒 修改安全密码
                    </a>
                    <a href="/admin/theme" class="submenu-item {% if active_tab == 'admin-personal-theme' %}active{% endif %}" style="text-decoration: none; display: block; color: inherit;">
                        🎨 个性化主题色
                    </a>
                </div>
            </div>
 
            <!-- Sidebar Footer with Logout Button -->
            <div class="sidebar-footer" style="padding: 15px; border-top: 1px solid rgba(255,255,255,0.05); overflow: hidden;">
                <button class="logout-btn" onclick="handleLogout()" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; height: 38px; border-radius: 10px; padding: 0 10px; font-size: 0.85rem; background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); color: #fca5a5; transition: all 0.2s ease;" onmouseover="this.style.background='var(--dino-red)'; this.style.borderColor='var(--dino-red)'; this.style.color='white';" onmouseout="this.style.background='rgba(239, 68, 68, 0.1)'; this.style.borderColor='rgba(239, 68, 68, 0.2)'; this.style.color='#fca5a5';">
                    <span>🚪</span>
                    <span class="sidebar-text" style="font-weight: 600; white-space: nowrap;">退出控制台</span>
                </button>
            </div>
            
            <div class="sidebar-collapse-btn" onclick="toggleSidebar()">
                <span id="collapseIcon">◀</span>
            </div>
        </aside>
 
        <!-- Main Workspace -->
        <div class="main-wrapper">
            <main class="main-content" style="padding-top: 25px;">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
 
    <!-- Reusable Toast Notification Container -->
    <div id="toastNotification" class="toast-notification"></div>
 
    <script src="/static/js/admin_base.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
