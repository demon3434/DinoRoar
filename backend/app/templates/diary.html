{% extends "base.html" %}

{% block title %}小恐龙 DinoRoar - 查看日记{% endblock %}

{% block content %}
<!-- Logs filters container -->
<div class="card" style="margin-bottom: 30px; padding: 20px;">
    <!-- 标题栏（可点击折叠） -->
    <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="toggleFiltersPanel()">
        <h3 style="font-size:1.05rem; font-weight:700; display:flex; align-items:center; gap:8px;">
            <span>🔍 心情时光穿梭机</span>
            <span id="filtersActiveBadge" style="display:none; width:8px; height:8px; border-radius:50%; background:#ef4444;"></span>
        </h3>
        <span id="toggleFiltersIcon" style="transition: transform 0.3s; font-size:0.9rem;">▼</span>
    </div>

    <div id="collapsibleFiltersContent" style="max-height: 500px; overflow: hidden; opacity: 1; transition: max-height 0.3s ease, opacity 0.3s ease; margin-top: 15px;">

        <!-- 第一行：关键字搜索（拉宽）+ 重置按钮 -->
        <div style="display: flex; align-items: flex-end; gap: 10px; margin-bottom: 12px;">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">关键字检索:</label>
                <input type="text" id="keywordFilter" placeholder="搜索标题或正文关键字..."
                    style="width: 100%; box-sizing: border-box; padding: 8px 12px; font-size: 0.8rem; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.05); color: var(--text-main); outline: none;">
            </div>
            <button onclick="clearFilters()"
                style="flex-shrink: 0; height: 36px; background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.25); font-size: 0.8rem; padding: 0 16px; border-radius: 8px; cursor: pointer; white-space: nowrap;">
                重置筛选
            </button>
        </div>

        <!-- 第二行：关系人物 / 恐龙心情 / 日期区间（三等分，永不换行） -->
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; align-items: end;">
            <!-- 关系人物 -->
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">关系人物:</label>
                <select id="personFilter"
                    style="width: 100%; padding: 8px 10px; font-size: 0.8rem; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.05); color: var(--text-main); outline: none; cursor: pointer;"></select>
            </div>

            <!-- 恐龙心情 -->
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">恐龙心情:</label>
                <select id="moodFilter"
                    style="width: 100%; padding: 8px 10px; font-size: 0.8rem; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.05); color: var(--text-main); outline: none; cursor: pointer;">
                    <option value="">全部心情</option>
                    <option value="Triceratops">😊 快乐三角龙 (开心)</option>
                    <option value="Pterodactyl_happy">🤩 冲天翼手龙 (兴奋)</option>
                    <option value="T-Rex_proud">😎 挺胸霸王龙 (得意)</option>
                    <option value="Brachiosaurus">🦕 大眼睛雷龙 (期待)</option>
                    <option value="Stegosaurus">😮 呆呆剑龙 (惊讶)</option>
                    <option value="Velociraptor">😐 佛系迅猛龙 (一般)</option>
                    <option value="Ankylosaurus_scared">😰 缩壳甲龙 (紧张)</option>
                    <option value="Pachycephalosaurus">🍃 叹气肿头龙 (遗憾)</option>
                    <option value="Parasaurolophus_regret">😣 耷拉角副栉龙 (后悔)</option>
                    <option value="Spinosaurus">😭 细雨棘龙 (伤心)</option>
                    <option value="Dilophosaurus">😡 怒火双脊龙 (愤怒)</option>
                </select>
            </div>

            <!-- 日期区间（开始 ~ 结束，合并在一格） -->
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">日期区间:</label>
                <div style="display: flex; align-items: center; gap: 6px;">
                    <input type="date" id="startDateFilter"
                        style="flex: 1; min-width: 0; padding: 8px 6px; font-size: 0.78rem; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.05); color: var(--text-main); outline: none; cursor: pointer;">
                    <span style="color: var(--text-muted); font-size: 0.8rem; flex-shrink: 0;">～</span>
                    <input type="date" id="endDateFilter"
                        style="flex: 1; min-width: 0; padding: 8px 6px; font-size: 0.78rem; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.05); color: var(--text-main); outline: none; cursor: pointer;">
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Logs timeline container -->
<div id="logsContainer" class="time-machine-container"></div>

<!-- Pagination controls -->
<div id="paginationContainer" style="display:flex; align-items:center; justify-content:center; gap:10px; margin-top:35px; margin-bottom:20px;"></div>
{% endblock %}

{% block scripts %}
<script src="/static/js/diary.js?v=202607142306"></script>
{% endblock %}
