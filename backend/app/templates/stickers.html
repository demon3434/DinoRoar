{% extends "base.html" %}

{% block title %}小恐龙 DinoRoar - 我的手账贴纸库{% endblock %}

{% block head %}
<style>
    /* 容器布局：双栏响应式 Glassmorphism 布局 */
    .stickers-layout {
        display: flex;
        gap: 25px;
        max-width: 1200px;
        margin: 0 auto;
        min-height: calc(100vh - 120px);
        align-items: stretch;
    }
    
    /* 1. 左侧系列分类侧边栏 */
    .series-sidebar {
        width: 240px;
        flex-shrink: 0;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 20px 15px;
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        gap: 15px;
        min-height: calc(100vh - 75px);
        max-height: calc(100vh - 75px);
        position: sticky;
        top: 25px;
    }
    
    .sidebar-title {
        font-size: 1.05rem;
        font-weight: 800;
        color: var(--text-main);
        padding-bottom: 12px;
        border-bottom: 1px solid var(--card-border);
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 5px;
    }
    
    .series-nav-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
        padding-right: 4px;
        scrollbar-width: thin;
        flex: 1;
    }
    
    .series-nav-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid transparent;
        color: var(--text-muted);
        font-size: 0.85rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .series-nav-item:hover {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-main);
        border-color: var(--card-border);
    }
    
    .series-nav-item.active {
        background: var(--accent-sunny, #f59e0b);
        color: #111;
        border-color: transparent;
        box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
    }
    
    .series-badge {
        font-size: 0.78rem;
        font-weight: 800;
        padding: 2px 8px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.08);
        font-family: monospace;
    }
    
    .series-nav-item.active .series-badge {
        background: rgba(0, 0, 0, 0.15);
        color: #111;
    }
    
    /* 2. 右侧贴纸主展现区 */
    .sticker-main-panel {
        flex: 1;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 25px 30px;
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: calc(100vh - 75px);
    }
    
    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 15px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--card-border);
        flex-wrap: wrap;
        gap: 12px;
    }
    
    .panel-title {
        font-size: 1.25rem;
        font-weight: 800;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
    }
    
    .panel-stats {
        font-size: 0.85rem;
        color: var(--text-muted);
        font-weight: 700;
    }
    
    /* Sticker Grid & Item styling (完全保持原有设计) */
    .stickers-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 25px;
        margin-top: 10px;
        flex: 1;
    }
    
    .sticker-item {
        position: relative;
        border-radius: 18px;
        padding: 16px 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        text-align: center;
        background: var(--card-bg, rgba(255, 255, 255, 0.02));
        border: 1px solid var(--card-border);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: default;
        min-height: 210px;
        box-sizing: border-box;
    }
    .sticker-item:hover {
        transform: translateY(-4px);
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(139, 92, 246, 0.35);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }
    
    .sticker-img {
        width: 85px;
        height: 85px;
        object-fit: contain;
        margin-bottom: 8px;
        transition: transform 0.3s ease;
    }
    .sticker-item:hover .sticker-img {
        transform: scale(1.08);
    }
    
    .sticker-name {
        font-size: 0.88rem;
        font-weight: 800;
        color: var(--text-main);
        margin-bottom: 2px;
    }
    .sticker-desc {
        font-size: 0.75rem;
        color: var(--text-muted);
        line-height: 1.3;
        margin-bottom: 6px;
    }

    /* 动作操作区（价格与兑换按钮） */
    .sticker-action-area {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        margin-top: auto;
        padding-top: 8px;
        border-top: 1px dashed var(--card-border);
    }
    
    .sticker-price {
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 3px;
    }

    .sticker-exchange-btn {
        padding: 5px 12px;
        border-radius: 10px;
        font-size: 0.78rem;
        font-weight: 800;
        border: none;
        cursor: pointer;
        background: linear-gradient(135deg, #a78bfa, #8b5cf6);
        color: white;
        box-shadow: 0 3px 8px rgba(139, 92, 246, 0.3);
        transition: all 0.2s ease;
    }
    .sticker-exchange-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 5px 12px rgba(139, 92, 246, 0.4);
    }
    .sticker-exchange-btn:disabled {
        background: rgba(0, 0, 0, 0.08);
        color: var(--text-muted);
        box-shadow: none;
        cursor: not-allowed;
        transform: none;
    }
    
    /* 圆形红底白色数字角标 */
    .count-badge {
        position: absolute;
        top: -8px;
        right: -8px;
        background: linear-gradient(135deg, #f97316, #ef4444);
        color: white;
        font-size: 0.75rem;
        font-weight: 800;
        min-width: 22px;
        height: 22px;
        border-radius: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 5px;
        box-shadow: 0 3px 8px rgba(239, 68, 68, 0.4);
        border: 2px solid var(--bg-gradient, #fff);
        animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
        0% { transform: scale(0); }
        100% { transform: scale(1); }
    }


    .owned-filter-btn {
        border-radius: 50px;
        padding: 5px 14px;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--card-border);
        color: var(--text-muted);
        display: inline-flex;
        align-items: center;
        gap: 4px;
        user-select: none;
    }
    .owned-filter-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-main);
        border-color: rgba(16, 185, 129, 0.4);
    }
    .owned-filter-btn.active {
        background: rgba(16, 185, 129, 0.18);
        color: #10b981;
        border-color: #10b981;
        box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
    }

    /* 规则底部提示卡 */
    .rules-card {
        margin-top: 30px;
        background: rgba(255, 255, 255, 0.01);
        border-left: 4px solid var(--accent-cloudy);
        padding: 12px 18px;
        border-radius: 0 12px 12px 0;
        font-size: 0.8rem;
        color: var(--text-muted);
        line-height: 1.6;
    }

    @media (max-width: 768px) {
        .stickers-layout {
            flex-direction: column;
        }
        .series-sidebar {
            width: 100%;
            min-height: auto;
            max-height: 180px;
            position: static;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="stickers-layout">
    <!-- 1. 左侧系列分类侧边栏 -->
    <div class="series-sidebar">
        <div class="sidebar-title">
            <span>📂</span> 贴纸系列
        </div>
        <div class="series-nav-list" id="seriesNavList">
            <!-- JS 动态灌入分类选单页签 -->
        </div>
    </div>

    <!-- 2. 右侧贴纸展现主面板 -->
    <div class="sticker-main-panel">
        <!-- 节日活动横幅 -->
        <div id="promoBannerContainer" style="display: none; margin-bottom: 16px; padding: 12px 18px; background: linear-gradient(135deg, rgba(139, 92, 246, 0.14), rgba(167, 139, 250, 0.08)); border: 1px solid rgba(139, 92, 246, 0.35); border-radius: 14px; font-size: 0.9rem; color: #6d28d9; font-weight: 700; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.08);">
            <span style="font-size: 1.2rem;">🎉</span> <span id="promoBannerText">节日特惠活动进行中</span>
        </div>

        <div class="panel-header">
            <h2 class="panel-title" id="panelTitle">
                <span>🎨</span> 贴纸商城
            </h2>
            <div style="display: flex; align-items: center; gap: 15px;">
                <button id="onlyOwnedBtn" class="owned-filter-btn" type="button">已拥有</button>
                <div class="panel-stats" id="panelStats">
                    已收集 0 款 / 全馆共 0 款
                </div>
            </div>
        </div>

        <!-- 贴纸网格呈现区 -->
        <div class="stickers-grid" id="stickersGrid">
            <!-- JS 动态灌入所选系列下的贴纸 -->
        </div>

        <div class="rules-card">
            <strong style="color: var(--text-main); display: block; margin-bottom: 4px;">💡 提示：</strong>
            可通过写日记赚取蛋能量并在此直接兑换精美贴纸，兑换后即可在手机端日记排版中随心选用哦！
        </div>
    </div>
</div>
{% endblock %}


{% block scripts %}
<script src="/static/js/stickers.js?v=202608160145"></script>
{% endblock %}
