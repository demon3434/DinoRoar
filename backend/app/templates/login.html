<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 恐龙风暴 DinoRoar</title>
    <!-- Local Fonts -->
    <link rel="stylesheet" href="/static/css/fonts.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --primary: #a855f7;
            --primary-hover: #c084fc;
            --accent: #22c55e;
            --card-bg: rgba(30, 27, 75, 0.45);
            --card-border: rgba(168, 85, 247, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            overflow: hidden;
            position: relative;
        }

        /* Abstract glowing blobs for premium background feel */
        .blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: 0;
            filter: blur(50px);
        }
        .blob-1 { top: -10%; left: -10%; }
        .blob-2 { bottom: -10%; right: -10%; }

        .container {
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
        }

        .logo-area {
            margin-bottom: 30px;
        }

        .logo-text {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(to right, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .logo-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-field {
            width: 100%;
            padding: 14px 20px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
            background: rgba(15, 23, 42, 0.8);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
        }

        .login-btn:active {
            transform: translateY(1px) scale(0.96);
            filter: brightness(0.9);
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
            text-align: center;
            background: rgba(239, 68, 68, 0.15);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container">
        <div class="login-card">
            <div class="logo-area">
                <h1 class="logo-text">DinoRoar</h1>
                <p class="logo-desc">🦖 恐龙风暴 · 私密树洞守护舱 🦕</p>
            </div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label class="input-label" for="username">账号名称</label>
                    <input class="input-field" type="text" id="username" required placeholder="输入账号名称">
                </div>
                <div class="input-group">
                    <label class="input-label" for="password">安全密码</label>
                    <input class="input-field" type="password" id="password" required placeholder="输入密码">
                </div>
                <button class="login-btn" type="submit">进入树洞</button>
            </form>
            <div class="error-msg" id="errorMsg">用户名或密码错误</div>
        </div>
    </div>

    <script>
        // Check if token exists, redirect accordingly
        async function checkSession() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const res = await fetch('/api/auth/me', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (res.ok) {
                        const user = await res.json();
                        if (user.is_admin) {
                            window.location.href = '/admin';
                        } else {
                            window.location.href = '/dashboard';
                        }
                    } else {
                        localStorage.removeItem('token');
                    }
                } catch(e) {
                    console.error("Session check failed", e);
                }
            }
        }
        checkSession();

        async function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errorMsg = document.getElementById('errorMsg');
            
            errorMsg.style.display = 'none';

            // Create x-www-form-urlencoded payload
            const params = new URLSearchParams();
            params.append('username', usernameInput.value);
            params.append('password', passwordInput.value);

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.access_token);
                    
                    // Fetch user info to redirect
                    const profileRes = await fetch('/api/auth/me', {
                        headers: { 'Authorization': 'Bearer ' + data.access_token }
                    });
                    
                    if (profileRes.ok) {
                        const user = await profileRes.json();
                        if (user.is_admin) {
                            window.location.href = '/admin';
                        } else {
                            window.location.href = '/dashboard';
                        }
                    } else {
                        errorMsg.textContent = "无法获取用户信息，请重试";
                        errorMsg.style.display = 'block';
                    }
                } else {
                    const errData = await response.json();
                    errorMsg.textContent = errData.detail || "用户名或密码错误";
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = "服务器连接失败，请检查网络";
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
