{% extends "admin_base.html" %}

{% block title %}个性化主题色 - 控制台 - DinoRoar{% endblock %}

{% block content %}
<header style="margin-bottom: 30px;">
    <h2 style="font-size: 1.4rem; font-weight: 800;">🎨 个性化配色主题</h2>
    <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">为您的管理控制台选择一款赏心悦目的配色风格，支持实时切换预览</p>
</header>

<div class="card" style="max-width: 600px; border: 1px solid var(--card-border);">
    <div class="card-title">切换系统配色风格</div>
    <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 25px; line-height: 1.6;">
        选择您喜爱的色彩方案。切换后页面风格将立即无缝更新，并同步至云端偏好设置，下次登录时自动载入。
    </p>
    
    <div class="form-group">
        <label class="form-label">选择系统主题</label>
        <div class="theme-grid">
            <button class="theme-btn" id="theme-btn-dark-neon" onclick="changeTheme('dark-neon')">
                <span>🌌 暗色霓虹 (默认)</span>
            </button>
            <button class="theme-btn" id="theme-btn-light-warm" onclick="changeTheme('light-warm')">
                <span>☀️ 温暖浅沙</span>
            </button>
            <button class="theme-btn" id="theme-btn-nordic-cool" onclick="changeTheme('nordic-cool')">
                <span>❄️ 极简冷灰</span>
            </button>
            <button class="theme-btn" id="theme-btn-deep-forest" onclick="changeTheme('deep-forest')">
                <span>🌲 深邃苍林</span>
            </button>
            <button class="theme-btn" id="theme-btn-aurora-night" onclick="changeTheme('aurora-night')">
                <span>💚 极光幻夜</span>
            </button>
            <button class="theme-btn" id="theme-btn-violet-dream" onclick="changeTheme('violet-dream')">
                <span>💜 罗兰紫幻</span>
            </button>
            <button class="theme-btn" id="theme-btn-sakura-peach" onclick="changeTheme('sakura-peach')">
                <span>🌸 樱粉蜜桃</span>
            </button>
            <button class="theme-btn" id="theme-btn-autumn-maple" onclick="changeTheme('autumn-maple')">
                <span>🍁 枫叶秋枫</span>
            </button>
            <button class="theme-btn" id="theme-btn-macaron-pink" onclick="changeTheme('macaron-pink')">
                <span>🍭 马卡龙粉</span>
            </button>
            <button class="theme-btn" id="theme-btn-macaron-blue" onclick="changeTheme('macaron-blue')">
                <span>🌊 马卡龙蓝</span>
            </button>
            <button class="theme-btn" id="theme-btn-macaron-green" onclick="changeTheme('macaron-green')">
                <span>🍃 马卡龙绿</span>
            </button>
            <button class="theme-btn" id="theme-btn-macaron-yellow" onclick="changeTheme('macaron-yellow')">
                <span>🍌 马卡龙黄</span>
            </button>
            <button class="theme-btn" id="theme-btn-macaron-purple" onclick="changeTheme('macaron-purple')">
                <span>🍇 马卡龙紫</span>
            </button>
            <button class="theme-btn" id="theme-btn-macaron-orange" onclick="changeTheme('macaron-orange')">
                <span>🍊 马卡龙橙</span>
            </button>
            <button class="theme-btn" id="theme-btn-dark-cyber" onclick="changeTheme('dark-cyber')">
                <span>🦾 暗色赛博</span>
            </button>
            <button class="theme-btn" id="theme-btn-dark-obsidian" onclick="changeTheme('dark-obsidian')">
                <span>🖤 黑曜石暗</span>
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function changeTheme(themeName) {
        document.documentElement.className = 'theme-' + themeName;
        // Update active class on grid buttons
        document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById('theme-btn-' + themeName);
        if (activeBtn) activeBtn.classList.add('active');

        try {
            const res = await fetch('/api/auth/theme', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ theme: themeName })
            });
            if (res.ok) {
                showToast("主题切换成功并已保存！", "success");
            }
        } catch(e) {
            console.error("Failed to save theme preference", e);
        }
    }

    // Recover current theme selector state
    async function initThemePage() {
        try {
            const res = await fetch('/api/auth/me', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) {
                const user = await res.json();
                if (user.theme) {
                    const activeBtn = document.getElementById('theme-btn-' + user.theme);
                    if (activeBtn) activeBtn.classList.add('active');
                }
            }
        } catch(e) {
            console.error("Failed to init theme selector", e);
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        initThemePage();
    });
</script>
{% endblock %}
